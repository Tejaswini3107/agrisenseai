services:
  backend:
    image: 561818313889.dkr.ecr.eu-north-1.amazonaws.com/agrisense-backend:latest
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - HF_TOKEN=${HF_TOKEN}
  admin:
    image: 561818313889.dkr.ecr.eu-north-1.amazonaws.com/agrisense-admin:latest
    ports:
      - "3000:3000"